<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<title>LeakRelocation Production Output Viewer</title>
<link rel="stylesheet" href="leaflet/leaflet.css"/>
<style>
.info{background:white;padding:10px 12px;border:1px solid #777;border-radius:4px;font-size:13px;box-shadow:0 1px 5px rgba(0,0,0,.35);max-width:620px}.legend-row{margin:3px 0}.swatch{display:inline-block;width:18px;height:10px;margin-right:6px;border:1px solid #555}.leaflet-popup-content table{border-collapse:collapse;font-size:12px}.leaflet-popup-content th,.leaflet-popup-content td{border:1px solid #ccc;padding:3px 5px;vertical-align:top}.leaflet-popup-content th{background:#f4f4f4}

html,body{height:100%;width:100%;margin:0;padding:0;font-family:Arial,sans-serif}
body{display:flex;flex-direction:column}
#map{flex:1 1 auto;width:100%;min-height:120px}
#attrPane{flex:0 0 auto;display:flex;flex-direction:column;height:260px;
  border-top:2px solid #888;background:#fff;font-size:12px;overflow:hidden}
#attrPane.collapsed{height:32px}
#attrPaneBar{flex:0 0 auto;display:flex;align-items:center;gap:8px;
  padding:4px 8px;background:#f0f0f0;border-bottom:1px solid #ccc;min-height:24px}
#attrPaneTabs{display:flex;gap:4px;flex-wrap:wrap}
.attr-tab{padding:3px 10px;border:1px solid #bbb;border-radius:3px 3px 0 0;
  background:#e4e4e4;cursor:pointer;white-space:nowrap}
.attr-tab.active{background:#fff;border-bottom-color:#fff;font-weight:bold}
.attr-tab .attr-count{color:#666;font-weight:normal;margin-left:4px}
#attrPaneSpacer{flex:1 1 auto}
#attrFilter{padding:2px 6px;border:1px solid #bbb;border-radius:3px;width:180px}
#attrPaneToggle{padding:2px 10px;border:1px solid #bbb;border-radius:3px;
  background:#fff;cursor:pointer}
#attrPaneNote{color:#666;padding:0 8px;white-space:nowrap}
#attrPaneBody{flex:1 1 auto;overflow:auto}
#attrPane.collapsed #attrPaneBody,#attrPane.collapsed #attrPaneFoot{display:none}
#attrTable{border-collapse:collapse;width:100%}
#attrTable th,#attrTable td{border:1px solid #ddd;padding:2px 6px;
  text-align:left;white-space:nowrap;max-width:320px;overflow:hidden;
  text-overflow:ellipsis}
#attrTable thead th{position:sticky;top:0;background:#f4f4f4;cursor:pointer;
  z-index:1}
#attrTable thead th:hover{background:#e8e8e8}
#attrTable tbody tr:nth-child(even){background:#fafafa}
#attrTable tbody tr:hover{background:#eef6ff;cursor:pointer}
#attrTable tbody tr.selected{background:#ffe9a8}
#attrPaneEmpty{padding:10px;color:#666}

</style>
</head>
<body>
<div id="map"></div>

<div id="attrPane">
  <div id="attrPaneBar">
    <div id="attrPaneTabs"></div>
    <span id="attrPaneNote"></span>
    <span id="attrPaneSpacer"></span>
    <input id="attrFilter" type="search" placeholder="Filter rows..." />
    <button id="attrPaneToggle" title="Show or hide the attribute table">Hide</button>
  </div>
  <div id="attrPaneBody"><div id="attrPaneEmpty">Loading attributes...</div></div>
</div>

<script src="leaflet/leaflet.js"></script>
<script>
const map=L.map('map',{preferCanvas:true});
const osm=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:20,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
const imagery=L.tileLayer('https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:20,attribution:'Tiles &copy; Esri'});
const topo=L.tileLayer('https://services.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:20,attribution:'Tiles &copy; Esri'});
map.fitBounds([[41.521676555915064,-72.23989271179036],[42.880662215206456,-69.9398737160849]],{padding:[24,24]});
function esc(v){if(v===null||v===undefined)return '';return String(v).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}
function materialFamily(mat){const toks=(mat||'').toString().toUpperCase().split(/[^A-Z0-9]+/).filter(Boolean);if(!toks.length)return 'UNKNOWN';const hit=(terms)=>terms.some(t=>{const p=t.split(' ');if(p.length>1){for(let i=0;i+p.length<=toks.length;i++){if(p.every((x,j)=>toks[i+j]===x))return true}return false}return toks.includes(t)||(t.length>=4&&toks.some(k=>k.startsWith(t)))});if(hit(['PLASTIC','POLY','PE','PVC','ABS','HDPE','MDPE','POLYBUTYLENE']))return 'PLASTIC';if(hit(['CAST IRON','DUCTILE','WROUGHT','IRON','CI','WI']))return 'IRON';if(hit(['STEEL','GALVANIZED','BARE','COATED','ST']))return 'STEEL';if(hit(['COPPER','CU']))return 'COPPER';if(hit(['UNKNOWN','UNK','COMPOSITE','UN']))return 'UNKNOWN';return 'OTHER'}
function materialColor(mat){const fam=materialFamily(mat);return {PLASTIC:'#00a651',STEEL:'#4d4d4d',IRON:'#8b4513',COPPER:'#b87333',UNKNOWN:'#999999',OTHER:'#7b68ee'}[fam]||'#7b68ee'}
function layerColor(linkedLayer){const text=(linkedLayer||'').toString().toLowerCase();if(text.includes('distribution'))return '#0066cc';if(text.includes('service'))return '#00a651';return '#d40000'}
function popupHtml(props){let rows='';const order=['LeakKey','OrigLeakOID','LinkedLayer','MatchedPipeOID','MatchedPipeGID','DistanceFt','SearchRadiusFt','MatchMaterial','MatchDiameter','MatchPressure'];const keys=[];for(const k of order)if(Object.prototype.hasOwnProperty.call(props,k))keys.push(k);for(const k of Object.keys(props))if(!keys.includes(k)&&keys.length<18)keys.push(k);for(const k of keys)rows+='<tr><th>'+esc(k)+'</th><td>'+esc(props[k])+'</td></tr>';return '<table>'+rows+'</table>'}
function bindFeature(f,l){l.bindPopup(popupHtml(f.properties||{}));l.on('click',()=>AttributePane.selectFromMap(l))}
const traceLayer=L.geoJSON(null,{style:f=>{const p=f.properties||{};return {color:layerColor(p.LinkedLayer),weight:2,opacity:.65}},onEachFeature:bindFeature});
const leakLayer=L.geoJSON(null,{pointToLayer:(f,latlng)=>{const p=f.properties||{};const c=materialColor(p.MatchMaterial);return L.circleMarker(latlng,{radius:4,color:'#222',weight:1,fillColor:c,fillOpacity:.82})},onEachFeature:bindFeature});
Promise.all([fetch('relocated_leaks.geojson').then(r=>r.json()),fetch('relocated_leak_trace_lines.geojson').then(r=>r.json())]).then(([leaks,traces])=>{traceLayer.addData(traces).addTo(map);leakLayer.addData(leaks).addTo(map);updateInfo(leaks.features.length,traces.features.length);AttributePane.register('leaks','Relocated leaks',leakLayer);AttributePane.register('traces','Trace lines',traceLayer);AttributePane.build()}).catch(err=>{alert('Failed to load local GeoJSON. Serve this folder with serve_viewer.py. '+err)});
L.control.layers({'OpenStreetMap':osm,'Esri imagery':imagery,'Esri topo':topo},{'Relocated leaks':leakLayer,'Trace lines':traceLayer},{collapsed:false}).addTo(map);L.control.scale({imperial:true,metric:true}).addTo(map);

const AttributePane = (function () {
  const MAX_ROWS = 500;
  const MAX_COLUMNS = 24;

  const layers = [];
  let activeKey = null;
  let rows = [];
  let columns = [];
  let sortColumn = null;
  let sortAscending = true;
  let selectedRow = null;

  function escapeHtml(value) {
    if (value === null || value === undefined) return '';
    return String(value)
      .replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;');
  }

  function register(key, label, layer) {
    layers.push({ key: key, label: label, layer: layer });
    if (activeKey === null) activeKey = key;
  }

  function entryFor(key) {
    return layers.find(function (item) { return item.key === key; });
  }

  /* Collect the features Leaflet currently holds for a layer. */
  function collect(entry) {
    const collected = [];
    if (!entry || !entry.layer || !entry.layer.eachLayer) return collected;
    entry.layer.eachLayer(function (child) {
      if (child.feature) collected.push({ feature: child.feature, mapLayer: child });
    });
    return collected;
  }

  function columnsFor(collected) {
    const seen = [];
    for (const item of collected) {
      const props = item.feature.properties || {};
      for (const key of Object.keys(props)) {
        if (!seen.includes(key)) seen.push(key);
        if (seen.length >= MAX_COLUMNS) return seen;
      }
    }
    return seen;
  }

  function filterText() {
    const input = document.getElementById('attrFilter');
    return input ? input.value.trim().toLowerCase() : '';
  }

  function visibleRows() {
    const needle = filterText();
    if (!needle) return rows;
    return rows.filter(function (item) {
      const props = item.feature.properties || {};
      return Object.keys(props).some(function (key) {
        const value = props[key];
        return value !== null && value !== undefined
          && String(value).toLowerCase().includes(needle);
      });
    });
  }

  function sorted(list) {
    if (sortColumn === null) return list;
    const copy = list.slice();
    copy.sort(function (left, right) {
      const a = (left.feature.properties || {})[sortColumn];
      const b = (right.feature.properties || {})[sortColumn];
      if (a === b) return 0;
      if (a === null || a === undefined) return 1;
      if (b === null || b === undefined) return -1;
      const na = Number(a), nb = Number(b);
      const numeric = !Number.isNaN(na) && !Number.isNaN(nb) && a !== '' && b !== '';
      const result = numeric ? na - nb : String(a).localeCompare(String(b));
      return sortAscending ? result : -result;
    });
    return copy;
  }

  function renderTabs() {
    const container = document.getElementById('attrPaneTabs');
    if (!container) return;
    container.innerHTML = layers.map(function (entry) {
      const count = collect(entry).length;
      const active = entry.key === activeKey ? ' active' : '';
      return '<div class="attr-tab' + active + '" data-key="' + escapeHtml(entry.key) + '">'
        + escapeHtml(entry.label)
        + '<span class="attr-count">' + count.toLocaleString() + '</span></div>';
    }).join('');
    container.querySelectorAll('.attr-tab').forEach(function (tab) {
      tab.addEventListener('click', function () { select(tab.dataset.key); });
    });
  }

  function renderTable() {
    const body = document.getElementById('attrPaneBody');
    const note = document.getElementById('attrPaneNote');
    if (!body) return;

    const shown = sorted(visibleRows());

    if (!shown.length) {
      body.innerHTML = '<div id="attrPaneEmpty">'
        + (rows.length ? 'No rows match the filter.' : 'No features in this layer.')
        + '</div>';
      if (note) note.textContent = '';
      return;
    }

    const capped = shown.slice(0, MAX_ROWS);
    if (note) {
      note.textContent = capped.length < shown.length
        ? 'showing ' + capped.length.toLocaleString() + ' of ' + shown.length.toLocaleString()
        : shown.length.toLocaleString() + ' rows';
    }

    let head = '';
    for (const column of columns) {
      const arrow = column === sortColumn ? (sortAscending ? ' ▲' : ' ▼') : '';
      head += '<th data-column="' + escapeHtml(column) + '">' + escapeHtml(column) + arrow + '</th>';
    }

    let table = '<table id="attrTable"><thead><tr>' + head + '</tr></thead><tbody>';
    capped.forEach(function (item, index) {
      const props = item.feature.properties || {};
      let cells = '';
      for (const column of columns) cells += '<td>' + escapeHtml(props[column]) + '</td>';
      table += '<tr data-index="' + index + '">' + cells + '</tr>';
    });
    table += '</tbody></table>';
    body.innerHTML = table;

    body.querySelectorAll('#attrTable thead th').forEach(function (header) {
      header.addEventListener('click', function () {
        const column = header.dataset.column;
        if (sortColumn === column) { sortAscending = !sortAscending; }
        else { sortColumn = column; sortAscending = true; }
        renderTable();
      });
    });

    body.querySelectorAll('#attrTable tbody tr').forEach(function (tr) {
      tr.addEventListener('click', function () {
        highlight(tr);
        focusFeature(capped[Number(tr.dataset.index)]);
      });
    });
  }

  function highlight(tr) {
    if (selectedRow) selectedRow.classList.remove('selected');
    selectedRow = tr;
    if (tr) tr.classList.add('selected');
  }

  /* Zoom to a row's feature and open its popup. */
  function focusFeature(item) {
    if (!item || !item.mapLayer) return;
    const mapLayer = item.mapLayer;
    if (mapLayer.getBounds) {
      const bounds = mapLayer.getBounds();
      if (bounds && bounds.isValid()) {
        map.fitBounds(bounds, { maxZoom: 19, padding: [40, 40] });
      }
    } else if (mapLayer.getLatLng) {
      map.setView(mapLayer.getLatLng(), Math.max(map.getZoom(), 18));
    }
    if (mapLayer.openPopup) mapLayer.openPopup();
  }

  /* Select the table row for a feature clicked on the map. */
  function selectFromMap(mapLayer) {
    for (const entry of layers) {
      const collected = collect(entry);
      if (collected.some(function (item) { return item.mapLayer === mapLayer; })) {
        if (entry.key !== activeKey) select(entry.key);
        break;
      }
    }
    const body = document.getElementById('attrPaneBody');
    if (!body) return;
    const shown = sorted(visibleRows()).slice(0, MAX_ROWS);
    const index = shown.findIndex(function (item) { return item.mapLayer === mapLayer; });
    if (index < 0) return;
    const tr = body.querySelector('#attrTable tbody tr[data-index="' + index + '"]');
    if (!tr) return;
    highlight(tr);
    tr.scrollIntoView({ block: 'nearest' });
  }

  function select(key) {
    activeKey = key;
    const entry = entryFor(key);
    rows = collect(entry);
    columns = columnsFor(rows);
    sortColumn = null;
    sortAscending = true;
    selectedRow = null;
    renderTabs();
    renderTable();
  }

  function build() {
    const toggle = document.getElementById('attrPaneToggle');
    const pane = document.getElementById('attrPane');
    if (toggle && pane && !toggle.dataset.wired) {
      toggle.dataset.wired = '1';
      toggle.addEventListener('click', function () {
        pane.classList.toggle('collapsed');
        toggle.textContent = pane.classList.contains('collapsed') ? 'Show' : 'Hide';
        if (map && map.invalidateSize) map.invalidateSize();
      });
    }
    const filter = document.getElementById('attrFilter');
    if (filter && !filter.dataset.wired) {
      filter.dataset.wired = '1';
      filter.addEventListener('input', function () { renderTable(); });
    }
    select(activeKey);
    if (map && map.invalidateSize) map.invalidateSize();
  }

  return { register: register, build: build, select: select, selectFromMap: selectFromMap };
})();

const info=L.control({position:'bottomleft'});info.onAdd=function(){const div=L.DomUtil.create('div','info');div.id='info';return div};info.addTo(map);
function updateInfo(pointCount,lineCount){document.getElementById('info').innerHTML='<b>LeakRelocation production output</b><br/>relocated_leaks: '+pointCount.toLocaleString()+'<br/>relocated_leak_offset_lines: '+lineCount.toLocaleString()+'<br/><div class="legend-row"><span class="swatch" style="background:#00a651"></span>Plastic / Service</div><div class="legend-row"><span class="swatch" style="background:#4d4d4d"></span>Steel</div><div class="legend-row"><span class="swatch" style="background:#8b4513"></span>Iron</div><div class="legend-row"><span class="swatch" style="background:#0066cc"></span>Distribution trace</div><div class="legend-row"><span class="swatch" style="background:#999999"></span>Unknown</div>'}
</script>
</body>
</html>
