[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leakrelocation"
version = "0.1.0"
description = "Historic leak relocation workflow for DNV / GeoPandas production processing"
requires-python = ">=3.9"
dependencies = [
    "geopandas>=0.14",
    "pandas>=2.0",
    "shapely>=2.0",
    "pyproj>=3.5",
    "requests>=2.31",
    "keyring>=24.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["leakrelocation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
